<!DOCTYPE html>
<html lang="pl-PL">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Clicker</h>
    </header>

    <main>
        <button id="clicker">Click!</button>
        <p>Clicks: <span id="clickCount">0</span></p>
        <p>Click power: <span id="clickPower">1</span></p>
        <p>Auto clicks: <span id="autoClicks">1</span></p>
        <p>Total clicks: <span id="totalClicks">0</span></p>
    </main>

    <aside>
        <p>Upgrades:</p>
        <p><button id="CPupgrade">Click Power (+1)</button> Click power upgrade cost: <span id="CPcost">5</span></p>
        <p><button id="ACupgrade1">Auto Click 1 (+1)</button> Auto click upgrade 1 cost: <span id="ACcost1">10</span></p>
        <p><button id="ACupgrade2">Auto Click 2 (+5)</button> Auto click upgrade 2 cost: <span id="ACcost2">100</span></p>
        <p><button id="ACupgrade3">Auto Click 3 (+25)</button> Auto click upgrade 3 cost: <span id="ACcost3">1000</span></p>
        <p><button id="ACupgrade4">Auto Click 4 (+100)</button> Auto click upgrade 4 cost: <span id="ACcost4">10000</span></p>
    
    </aside>

    <footer>
        <p>@ Gabriel Chartwik 2026</p>
    </footer>

    <script src="script.js"></script>
    
</body>
</html>
